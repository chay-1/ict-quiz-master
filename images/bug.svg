<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Malware">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dc2626" stop-opacity=".16"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>
      <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#dc2626" flood-opacity=".18"/></filter>
    </defs>
    <rect x="8" y="8" width="624" height="344" rx="32" fill="url(#bg)" stroke="#dc2626" stroke-opacity=".22" stroke-width="3"/>
    <circle cx="320" cy="160" r="104" fill="#fff" stroke="#dc2626" stroke-opacity=".2" stroke-width="5" filter="url(#shadow)">
      <animate attributeName="r" values="98;108;98" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="320" y="190" text-anchor="middle" font-size="112" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">🐛</text>
    <text x="320" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">Malware</text>
    <circle cx="115" cy="90" r="10" fill="#dc2626" opacity=".5"><animate attributeName="cy" values="90;72;90" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="525" cy="245" r="14" fill="#dc2626" opacity=".35"><animate attributeName="cy" values="245;265;245" dur="2.8s" repeatCount="indefinite"/></circle>
    </svg>